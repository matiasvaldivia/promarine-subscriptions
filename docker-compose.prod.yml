services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: promarine-subscriptions-app-1
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      APP_NAME: ${APP_NAME:-Promarine Suscripciones}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://promarine.influencergrowthsystem.com}
      MERCADOPAGO_MODE: ${MERCADOPAGO_MODE:-production}
      SHOPIFY_MODE: ${SHOPIFY_MODE:-production}
      IGS_MODE: ${IGS_MODE:-production}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: promarine-subscriptions-nginx-1
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - default
      - proxy-net
    restart: unless-stopped

volumes:
  composer_cache:

networks:
  default: {}
  proxy-net:
    external: true
    name: proxy-net
