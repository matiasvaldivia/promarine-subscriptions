services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      APP_NAME: ${APP_NAME:-Promarine Suscripciones}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      TAMARA_USERNAME: ${TAMARA_USERNAME:-${user_tamar:-}}
      TAMARA_PASSWORD: ${TAMARA_PASSWORD:-${pass_tamar:-}}
      MERCADOPAGO_MODE: ${MERCADOPAGO_MODE:-mock}
      SHOPIFY_MODE: ${SHOPIFY_MODE:-mock}
      IGS_MODE: ${IGS_MODE:-mock}
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
  mysql:
    image: mysql:8.4
    ports: ["33061:3306"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-${base_name:-promarine_subscriptions}}
      MYSQL_USER: ${DB_USERNAME:-${user_bd:-promarine}}
      MYSQL_PASSWORD: ${DB_PASSWORD:-${pass_bd:-promarine_local}}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_only}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal_root_only"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025"]
volumes:
  mysql_data:
  composer_cache:
